<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100vw;height:100vh;overflow:hidden}
body{font-family:Inter,sans-serif;color:#fff;background:radial-gradient(900px 600px at 85% 30%,#10b98166,transparent 60%),linear-gradient(150deg,#011c15 0%,#053d2e 55%,#0a5a43 100%);position:relative}
.grid{position:absolute;inset:0;opacity:.13;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:48px 48px}
.left{position:absolute;left:64px;top:56px;width:720px}
.brand{display:flex;align-items:center;gap:14px;font-size:34px;font-weight:800;letter-spacing:-.01em}
.brand img{width:58px;height:58px}
h1{font-size:88px;line-height:.98;font-weight:900;letter-spacing:-.04em;margin:30px 0 0}
h1 em{font-style:normal;color:#34d399}
.sub{font-size:28px;font-weight:700;color:#d1fae5;margin-top:22px;line-height:1.2}
.badges{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.b{font-size:26px;font-weight:800;padding:10px 18px;border-radius:14px;background:#fff;color:#064e3b}
.b.r{background:#fecaca;color:#7f1d1d}
.foot{position:absolute;left:64px;bottom:40px;font-size:22px;font-weight:600;color:#a7f3d0}
.chip{position:absolute;right:70px;top:140px;width:400px;height:400px;filter:drop-shadow(0 30px 60px rgba(0,0,0,.45))}
.flow{position:absolute;right:66px;bottom:44px;font-size:24px;font-weight:800;color:#ecfdf5;background:#ffffff18;border:2px solid #ffffff33;padding:10px 18px;border-radius:999px}
</style></head><body><div class="grid"></div>
<div class="left">
  <div class="brand"><img src="logo.svg">GreenSilicon</div>
  <h1>What does your<br><em>AI chip</em> really<br>cost the planet?</h1>
  <div class="sub">Blockchain + AI passports for chip carbon &amp; water</div>
  <div class="badges"><span class="b">Up to −90% CO₂ per AI job</span><span class="b r">Greenwashing caught</span></div>
</div>
<svg class="chip" viewBox="0 0 512 512"><defs><linearGradient id="d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#059669"/></linearGradient></defs>
<g stroke="#6ee7b7" stroke-width="18" stroke-linecap="round"><path d="M176 70v62M226 70v62M286 70v62M336 70v62M176 380v62M226 380v62M286 380v62M336 380v62M70 176h62M70 226h62M70 286h62M70 336h62M380 176h62M380 226h62M380 286h62M380 336h62"/></g>
<rect x="132" y="132" width="248" height="248" rx="44" fill="url(#d)"/>
<path d="M200 330c66 0 126-34 142-134-90 7-158 52-142 134z" fill="#ecfdf5"/><path d="M200 330l64-64" stroke="#059669" stroke-width="14" stroke-linecap="round"/></svg>
<div class="flow">Fab → Data center → AI job</div>
<div class="foot">Divya Kohli · UC Santa Cruz · IEEE ClimateChain 2026</div>
</body></html>
